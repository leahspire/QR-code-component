<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Outfit:wght@100..900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>

    body{
      margin: 0;
      padding: 0;
      min-height: fit-content;
    }
    
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }

    .code{
      margin: 10vh;
      border-radius: 4vh;
      align-items: center;
      justify-content: center;
      margin-left: 85vh;
      text-align: center;
      padding: 20px;
      margin-top: 10%;
      width: 20%;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    }

    .code img{
      width: 100%;
      border-radius: 5vh;
      position: relative;
    }

    .code p{
      font-size: 15px;
      font-family: "Outfit", sans-serif;
    }

    @media (max-width: 900px) {
      .code{
        width: 60%;
        margin-left: 5vh;
      }
    }
  </style>
</head>
<body>

  <div class="code">
    <img src="images/image-qr-code.png" alt="">
    <h2>Improve your front-end skills by building projects</h2>
    <p> Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>

  </div>


 
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Ademola Leah Olabisi</a>.
  </footer>
</body>
</html>
